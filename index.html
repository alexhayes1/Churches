<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Churches">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f4a3a">
<title>My Churches</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1d1d1d; background: #e8e8e8; }
.hidden { display: none !important; }

#topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1200; background: #2f4a3a; color: #fff; padding: calc(env(safe-area-inset-top) + 8px) 14px 8px 14px; display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
#title { font-size: 18px; font-weight: 600; }
#count { font-size: 13px; font-weight: 400; opacity: 0.8; margin-left: 6px; }
#addBtn { background: #fff; color: #2f4a3a; border: none; border-radius: 18px; padding: 8px 16px; font-size: 16px; font-weight: 600; }

#map { position: fixed; top: calc(env(safe-area-inset-top) + 52px); left: 0; right: 0; bottom: 0; z-index: 1; }

#pickBanner { position: fixed; top: calc(env(safe-area-inset-top) + 60px); left: 12px; right: 12px; z-index: 1250; background: #8a1c2b; color: #fff; padding: 10px 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
#pickBanner button { background: #fff; color: #8a1c2b; border: none; border-radius: 14px; padding: 6px 12px; font-size: 14px; font-weight: 600; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -2px 14px rgba(0,0,0,0.25); transition: height 0.25s ease; overflow: hidden; }
.sheet.s0 { height: 56px; }
.sheet.s1 { height: 38%; }
.sheet.s2 { height: calc(100% - 60px - env(safe-area-inset-top)); }
#handle { height: 28px; display: flex; align-items: center; justify-content: center; }
.grip { width: 44px; height: 5px; border-radius: 3px; background: #c4c4c4; }
#list { height: calc(100% - 28px); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 12px calc(env(safe-area-inset-bottom) + 24px) 12px; }

.item { display: flex; align-items: center; padding: 10px 6px; border-bottom: 1px solid #eee; }
.thumb { width: 48px; height: 48px; border-radius: 10px; background: #e9efe9; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; margin-right: 12px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.itemname { font-size: 16px; font-weight: 600; }
.itemsub { font-size: 13px; color: #777; margin-top: 2px; }
.empty { padding: 18px 6px; color: #666; font-size: 15px; line-height: 1.4; }
.tools { padding: 18px 0 8px 0; display: flex; gap: 10px; flex-wrap: wrap; }
.tools button { background: #f0f0f0; border: none; border-radius: 14px; padding: 8px 12px; font-size: 13px; color: #333; }
.version { width: 100%; font-size: 12px; color: #999; margin-top: 4px; }

.pin-dot { width: 28px; height: 28px; border-radius: 50%; background: #8a1c2b; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.pin-dot.sel { background: #d9a400; transform: scale(1.25); }

.card { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1300; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -2px 14px rgba(0,0,0,0.3); padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px) 18px; max-height: 75%; overflow-y: auto; }
.card h2 { margin: 0 0 6px 0; font-size: 21px; }
.card p { margin: 6px 0; font-size: 15px; line-height: 1.4; }
.card .small { font-size: 12px; color: #888; }
.strip { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0 6px 0; -webkit-overflow-scrolling: touch; }
.strip img { height: 130px; border-radius: 8px; flex-shrink: 0; display: block; }
.btnrow { display: flex; gap: 10px; margin-top: 14px; }
.btnrow button { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 600; background: #eef2ee; color: #2f4a3a; }
.btnrow button.danger { background: #f6e3e5; color: #8a1c2b; }

.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1400; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; }
.form { background: #fff; width: 100%; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px) 18px; }
.form h2 { margin: 0 0 12px 0; font-size: 20px; }
.form label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px 0; font-weight: 600; }
.form input[type="text"], .form input[type="date"], .form textarea { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; background: #fff; }
.form textarea { min-height: 80px; }
#locLabel { font-size: 14px; color: #444; margin: 4px 0 8px 0; }
.locbtns { display: flex; gap: 10px; }
.locbtns button { flex: 1; border: none; border-radius: 10px; padding: 11px 6px; font-size: 15px; background: #eef2ee; color: #2f4a3a; font-weight: 600; }
.save { background: #2f4a3a !important; color: #fff !important; }

.photobtn { width: 100%; border: none; border-radius: 10px; padding: 11px 6px; font-size: 15px; background: #eef2ee; color: #2f4a3a; font-weight: 600; }
.pgrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px 0; }
.pitem { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; background: #e9efe9; }
.pitem img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pitem .x { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0,0,0,0.65); color: #fff; font-size: 14px; line-height: 24px; padding: 0; }
.pitem .badge { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(47,74,58,0.88); color: #fff; font-size: 11px; text-align: center; padding: 2px 0; }
.hint { font-size: 12px; color: #777; margin: 6px 0 0 0; }

#viewer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1600; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; }
#viewer img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
#viewerClose { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 16px; padding: 8px 14px; font-size: 15px; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); transform: translateX(-50%); background: rgba(30,30,30,0.92); color: #fff; padding: 10px 16px; border-radius: 18px; font-size: 14px; z-index: 1700; max-width: 85%; text-align: center; }
</style>
</head>
<body>

<div id="topbar">
  <div id="title">My Churches <span id="count"></span></div>
  <button id="addBtn">+ Add</button>
</div>

<div id="map"></div>

<div id="pickBanner" class="hidden">
  <span>Tap the map to place the pin</span>
  <button id="pickCancel">Cancel</button>
</div>

<div id="sheet" class="sheet s1">
  <div id="handle"><div class="grip"></div></div>
  <div id="list"></div>
</div>

<div id="detail" class="card hidden">
  <div id="detailBody"></div>
  <div class="btnrow">
    <button id="editBtn">Edit</button>
    <button id="deleteBtn" class="danger">Delete</button>
    <button id="closeDetailBtn">Close</button>
  </div>
</div>

<div id="formWrap" class="overlay hidden">
  <div class="form">
    <h2 id="formTitle">Add a church</h2>
    <label for="fName">Name</label>
    <input id="fName" type="text" placeholder="e.g. St Mary's, Totnes" autocomplete="off">
    <label for="fDate">Date visited</label>
    <input id="fDate" type="date">
    <label for="fNotes">Notes</label>
    <textarea id="fNotes" placeholder="Anything you want to remember"></textarea>
    <label>Photos</label>
    <div id="pgrid" class="pgrid"></div>
    <button id="photoBtn" class="photobtn">Add photos</button>
    <input id="fPhotos" type="file" accept="image/*" multiple class="hidden">
    <p class="hint">The first photo is the icon. Tap a photo to make it the icon, or tap x to remove it.</p>
    <label>Location</label>
    <div id="locLabel">No location chosen yet</div>
    <div class="locbtns">
      <button id="useLocBtn">Use my location</button>
      <button id="pickBtn">Choose on map</button>
    </div>
    <div class="btnrow">
      <button id="cancelBtn">Cancel</button>
      <button id="saveBtn" class="save">Save</button>
    </div>
  </div>
</div>

<div id="viewer" class="hidden">
  <button id="viewerClose">Close</button>
  <img id="viewerImg" alt="">
</div>

<div id="toast" class="hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var DB_NAME = "churchTracker";
  var STORE = "churches";
  var MAX_PHOTOS = 8;
  var PHOTO_MAX_SIDE = 1000;
  var ICON_SIZE = 120;
  var db = null;
  var churches = [];
  var markers = {};
  var markerLayer = null;
  var map = null;
  var sheetState = 1;
  var pendingLatLng = null;
  var pickMode = false;
  var pickMarker = null;
  var editingId = null;
  var currentId = null;
  var toastTimer = null;
  var formPhotos = [];
  var busy = false;

  function byId(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }

  function showToast(msg) {
    var t = byId("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { t.classList.add("hidden"); }, 3000);
  }

  function formatDate(v) {
    if (!v) { return ""; }
    var d = new Date(v + "T12:00:00");
    if (isNaN(d.getTime())) { return v; }
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  }

  function photosOf(c) {
    return (c && c.photos && c.photos.length) ? c.photos : [];
  }

  /* ---------- Storage (IndexedDB) ---------- */

  function openDb(cb) {
    if (!window.indexedDB) {
      showToast("This browser cannot save data.");
      return;
    }
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = function (e) { db = e.target.result; cb(); };
    req.onerror = function () { showToast("Could not open storage."); };
  }

  function loadAll(cb) {
    var tx = db.transaction(STORE, "readonly");
    var rq = tx.objectStore(STORE).getAll();
    rq.onsuccess = function () { churches = rq.result || []; cb(); };
    rq.onerror = function () { showToast("Could not read saved churches."); };
  }

  function saveMany(items, cb) {
    var tx = db.transaction(STORE, "readwrite");
    var store = tx.objectStore(STORE);
    for (var i = 0; i < items.length; i++) { store.put(items[i]); }
    tx.oncomplete = function () { if (cb) { cb(); } };
    tx.onabort = function () { showToast("Could not save. Storage may be full."); };
  }

  function deleteMany(ids, cb) {
    var tx = db.transaction(STORE, "readwrite");
    var store = tx.objectStore(STORE);
    for (var i = 0; i < ids.length; i++) { store.delete(ids[i]); }
    tx.oncomplete = function () { if (cb) { cb(); } };
    tx.onabort = function () { showToast("Could not delete."); };
  }

  function findChurch(id) {
    for (var i = 0; i < churches.length; i++) {
      if (churches[i].id === id) { return churches[i]; }
    }
    return null;
  }

  function newId() {
    return "c" + Date.now() + "-" + Math.floor(Math.random() * 100000);
  }

  /* ---------- Photos ---------- */

  function loadImageFromFile(file, ok, fail) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { ok(img, url); };
    img.onerror = function () { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  }

  function drawScaled(img, maxSide, quality) {
    var w = img.naturalWidth;
    var h = img.naturalHeight;
    var scale = Math.min(1, maxSide / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement("canvas");
    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    return canvas.toDataURL("image/jpeg", quality);
  }

  function drawSquare(img, size, quality) {
    var w = img.naturalWidth;
    var h = img.naturalHeight;
    var side = Math.min(w, h);
    var sx = (w - side) / 2;
    var sy = (h - side) / 2;
    var canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    return canvas.toDataURL("image/jpeg", quality);
  }

  function processNext(files, index, done) {
    if (index >= files.length) { done(); return; }
    if (formPhotos.length >= MAX_PHOTOS) {
      showToast("Maximum of " + MAX_PHOTOS + " photos per church.");
      done();
      return;
    }
    loadImageFromFile(files[index], function (img, url) {
      try {
        var full = drawScaled(img, PHOTO_MAX_SIDE, 0.8);
        var thumb = drawSquare(img, ICON_SIZE, 0.8);
        formPhotos.push({ full: full, thumb: thumb });
      } catch (err) {
        showToast("One photo was too large to process.");
      }
      URL.revokeObjectURL(url);
      processNext(files, index + 1, done);
    }, function () {
      showToast("Could not read one of the photos.");
      processNext(files, index + 1, done);
    });
  }

  function handlePhotoChoice() {
    var input = byId("fPhotos");
    var files = [];
    for (var i = 0; i < input.files.length; i++) { files.push(input.files[i]); }
    if (!files.length) { return; }
    busy = true;
    showToast("Processing photos...");
    processNext(files, 0, function () {
      input.value = "";
      busy = false;
      renderFormPhotos();
    });
  }

  function makePhotoItem(i) {
    var p = formPhotos[i];
    var box = el("div", "pitem");
    var img = document.createElement("img");
    img.src = p.thumb;
    img.alt = "";
    img.addEventListener("click", function () {
      if (i === 0) { return; }
      var moved = formPhotos.splice(i, 1)[0];
      formPhotos.unshift(moved);
      renderFormPhotos();
      showToast("Set as the icon.");
    });
    box.appendChild(img);
    var x = el("button", "x", "x");
    x.addEventListener("click", function () {
      formPhotos.splice(i, 1);
      renderFormPhotos();
    });
    box.appendChild(x);
    if (i === 0) { box.appendChild(el("div", "badge", "Icon")); }
    return box;
  }

  function renderFormPhotos() {
    var grid = byId("pgrid");
    grid.innerHTML = "";
    for (var i = 0; i < formPhotos.length; i++) {
      grid.appendChild(makePhotoItem(i));
    }
    byId("photoBtn").textContent = "Add photos (" + formPhotos.length + " of " + MAX_PHOTOS + ")";
  }

  function openViewer(src) {
    byId("viewerImg").src = src;
    byId("viewer").classList.remove("hidden");
  }

  function closeViewer() {
    byId("viewer").classList.add("hidden");
    byId("viewerImg").src = "";
  }

  /* ---------- Map ---------- */

  function initMap() {
    map = L.map("map", { zoomControl: false, attributionControl: true }).setView([54.5, -3], 5);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);

    map.on("click", function (e) {
      if (!pickMode) { return; }
      pickMode = false;
      byId("pickBanner").classList.add("hidden");
      setPending(e.latlng.lat, e.latlng.lng);
      byId("formWrap").classList.remove("hidden");
    });
  }

  function pinIcon(selected) {
    var cls = selected ? "pin-dot sel" : "pin-dot";
    return L.divIcon({
      className: "",
      html: "<div class=\"" + cls + "\">\u26EA</div>",
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  function makeMarker(c) {
    var m = L.marker([c.lat, c.lng], { icon: pinIcon(false) });
    m.on("click", function () { selectChurch(c.id); });
    m.addTo(markerLayer);
    markers[c.id] = m;
  }

  function highlight(id) {
    for (var key in markers) {
      if (markers.hasOwnProperty(key)) {
        markers[key].setIcon(pinIcon(key === id));
        markers[key].setZIndexOffset(key === id ? 1000 : 0);
      }
    }
  }

  function fitAll() {
    if (!churches.length) {
      map.setView([54.5, -3], 5);
      return;
    }
    var pts = [];
    for (var i = 0; i < churches.length; i++) { pts.push([churches[i].lat, churches[i].lng]); }
    map.fitBounds(L.latLngBounds(pts), {
      paddingTopLeft: [30, 30],
      paddingBottomRight: [30, Math.round(window.innerHeight * 0.4)],
      maxZoom: 12
    });
  }

  /* ---------- Rendering ---------- */

  function renderAll() {
    markerLayer.clearLayers();
    markers = {};
    for (var i = 0; i < churches.length; i++) { makeMarker(churches[i]); }
    if (currentId) { highlight(currentId); }
    renderList();
    byId("count").textContent = churches.length ? "(" + churches.length + ")" : "";
  }

  function renderList() {
    var list = byId("list");
    list.innerHTML = "";
    var sorted = churches.slice().sort(function (a, b) {
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
    });

    if (!sorted.length) {
      list.appendChild(el("div", "empty", "No churches yet. Tap + Add, or load the sample churches below to see how it works."));
    }

    sorted.forEach(function (c) {
      var item = el("div", "item");
      var thumb = el("div", "thumb");
      var ph = photosOf(c);
      if (ph.length) {
        var im = document.createElement("img");
        im.src = ph[0].thumb;
        im.alt = "";
        thumb.appendChild(im);
      } else {
        thumb.textContent = "\u26EA";
      }
      item.appendChild(thumb);
      var txt = el("div", "");
      txt.appendChild(el("div", "itemname", c.name));
      var sub = c.dateVisited ? "Visited " + formatDate(c.dateVisited) : "No date added";
      txt.appendChild(el("div", "itemsub", sub));
      item.appendChild(txt);
      item.addEventListener("click", function () { selectChurch(c.id); });
      list.appendChild(item);
    });

    var tools = el("div", "tools");
    var loadBtn = el("button", "", "Load 3 sample churches");
    loadBtn.addEventListener("click", loadSamples);
    var removeBtn = el("button", "", "Remove sample churches");
    removeBtn.addEventListener("click", removeSamples);
    tools.appendChild(loadBtn);
    tools.appendChild(removeBtn);
    tools.appendChild(el("div", "version", "Version: Stage 2 (photos)"));
    list.appendChild(tools);
  }

  /* ---------- Bottom sheet ---------- */

  function setSheet(n) {
    sheetState = n;
    byId("sheet").className = "sheet s" + n;
  }

  function initSheet() {
    var handle = byId("handle");
    var startY = null;
    handle.addEventListener("touchstart", function (e) {
      startY = e.touches[0].clientY;
    }, { passive: true });
    handle.addEventListener("touchend", function (e) {
      if (startY === null) { return; }
      var dy = e.changedTouches[0].clientY - startY;
      startY = null;
      if (dy < -30) { setSheet(Math.min(2, sheetState + 1)); }
      else if (dy > 30) { setSheet(Math.max(0, sheetState - 1)); }
      else { setSheet(sheetState === 0 ? 1 : (sheetState === 1 ? 2 : 0)); }
    }, { passive: true });
  }

  /* ---------- Detail card ---------- */

  function selectChurch(id) {
    var c = findChurch(id);
    if (!c) { return; }
    currentId = id;
    highlight(id);
    setSheet(0);
    map.flyTo([c.lat, c.lng], Math.max(map.getZoom(), 14), { duration: 0.8 });

    var body = byId("detailBody");
    body.innerHTML = "";
    body.appendChild(el("h2", "", c.name));

    var ph = photosOf(c);
    if (ph.length) {
      var strip = el("div", "strip");
      ph.forEach(function (p) {
        var im = document.createElement("img");
        im.src = p.full;
        im.alt = "";
        im.addEventListener("click", function () { openViewer(p.full); });
        strip.appendChild(im);
      });
      body.appendChild(strip);
    }

    if (c.dateVisited) { body.appendChild(el("p", "", "Visited: " + formatDate(c.dateVisited))); }
    if (c.notes) { body.appendChild(el("p", "", c.notes)); }
    body.appendChild(el("p", "small", "Location: " + c.lat.toFixed(5) + ", " + c.lng.toFixed(5)));
    if (c.sample) { body.appendChild(el("p", "small", "This is a sample church for testing.")); }
    byId("detail").classList.remove("hidden");
  }

  function closeDetail() {
    byId("detail").classList.add("hidden");
    currentId = null;
    highlight(null);
    setSheet(1);
  }

  /* ---------- Add / edit form ---------- */

  function setPending(lat, lng) {
    pendingLatLng = { lat: lat, lng: lng };
    byId("locLabel").textContent = "Location set: " + lat.toFixed(5) + ", " + lng.toFixed(5);
    if (pickMarker) { map.removeLayer(pickMarker); }
    pickMarker = L.circleMarker([lat, lng], { radius: 12, color: "#8a1c2b", weight: 3, fillColor: "#8a1c2b", fillOpacity: 0.35 }).addTo(map);
  }
